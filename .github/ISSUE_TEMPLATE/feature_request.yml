name: Feature request
description: Something Bow should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Bow help?
      description: If Arc did this, describe how it behaved. Describe it in words; please do not attach Arc's assets.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
