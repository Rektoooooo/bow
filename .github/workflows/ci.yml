# Builds Bow and runs the unit tests on every push and pull request. The end-to-end checks (npm run e2e) open real
# windows for several minutes, so they run on a developer's Mac before a push rather than here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
