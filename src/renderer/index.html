<!doctype html>
<!--
  WHY this file exists:
    The browser window's own page: the sidebar on the left, the toolbar above the page, and the colored frame.
    The web page "card" is not part of this page: it is a separate WebContentsView that main.ts lays over the
    #card-slot area. #card-slot only shows when no tab is open.

  Data source:
    sidebar.ts fills the sidebar and toolbar from BrowserState and RuntimeState.

  Data flow:
    main.ts → state over IPC → sidebar.ts renderAll() → the elements below
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Only our own script and styles may run in this page. Images may come from websites (favicons) or data: URLs. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https: http: data:">
    <title>Bow</title>
    <link rel="stylesheet" href="./sidebar.css">
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="Tabs and Spaces">
      <div class="sidebar-header">
        <div class="traffic-light-space"></div>
        <div id="sidebar-header-buttons" class="header-buttons"></div>
      </div>
      <div id="favorites" class="favorites" aria-label="Favorites"></div>
      <div id="sidebar-scroll" class="sidebar-scroll">
        <div id="space-content" class="space-content"></div>
      </div>
      <div id="archive-undo" class="archive-undo" role="status" hidden></div>
      <div id="media-player" class="media-player" hidden></div>
      <div id="update-notice" class="update-notice" hidden></div>
      <footer id="bottom-bar" class="bottom-bar"></footer>
      <div id="sidebar-resizer" class="sidebar-resizer" title="Drag to resize the sidebar (all the way left hides it)"></div>
    </aside>
    <!-- With the sidebar hidden, touching the window's left edge shows it for a moment, like Arc. -->
    <div id="reveal-edge" class="reveal-edge"></div>
    <section id="main-column" class="main-column">
      <!-- The page card, like Arc's: the toolbar on top, the page (a native view placed by main.ts) below it. -->
      <div id="card" class="card">
        <header id="toolbar" class="toolbar" aria-label="Page controls"></header>
        <main id="card-slot" class="card-slot">
          <div id="empty-card" class="empty-card">
            <p class="empty-title">No tab open</p>
            <p class="empty-hint">Press ⌘T to search or type an address.</p>
          </div>
          <!-- A page is on screen in one window at a time: another window that shows this tab keeps it. -->
          <div id="elsewhere-card" class="empty-card" hidden>
            <p class="empty-title">Open in another window</p>
            <p class="empty-hint">This tab is showing in another window.</p>
            <button id="move-here-button" class="move-here-button" type="button">Move to This Window</button>
          </div>
        </main>
      </div>
    </section>
    <script type="module" src="./sidebar.js"></script>
  </body>
</html>
