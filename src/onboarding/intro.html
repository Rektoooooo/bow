<!doctype html>
<!--
  WHY this file exists:
    Bow's first start begins on the desktop (main/onboardingIntro.ts): this see-through page over the screen dims the
    desktop, shows one soft blob in Bow's colors that breathes, then lets it flow into the onboarding window's place,
    where the real window takes over; then the dimming lifts.

  Data source:
    The onboarding window's place, in the address's query (onboardingIntro.ts).

  Data flow:
    onboardingIntro.ts → intro.html → intro.ts dims and breathes → window.growIntoWindow() → window.leaveIntro()
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>Bow</title>
    <link rel="stylesheet" href="./intro.css">
  </head>
  <body>
    <div class="intro-scrim"></div>
    <div class="intro-frame" id="intro-frame">
      <div class="intro-hole"></div>
      <div class="intro-shadow"></div>
      <div class="intro-soft">
        <div class="intro-shape is-breathing">
          <div class="intro-window-fill">
            <div class="intro-wash">
              <span class="intro-light intro-light-1"></span>
              <span class="intro-light intro-light-2"></span>
              <span class="intro-light intro-light-3"></span>
            </div>
            <span class="intro-grain"></span>
          </div>
          <div class="intro-blob-fill"></div>
          <span class="intro-highlight"></span>
          <span class="intro-glint"></span>
        </div>
      </div>
    </div>
    <script type="module" src="./intro.js"></script>
  </body>
</html>
