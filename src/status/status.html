<!doctype html>
<!--
  WHY this file exists:
    The little address bubble at the bottom-left of the page while the pointer is over a link (Arc and every browser
    show where a link goes). It lives in its own small transparent view above the page.

  Data source:
    statusBubble.ts sets the text with window.showStatus(text).
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
    <title>Status</title>
    <link rel="stylesheet" href="./status.css">
  </head>
  <body>
    <span id="status" class="status"></span>
    <script type="module" src="./status.js"></script>
  </body>
</html>
